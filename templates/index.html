<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>爱理财的DU</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --bg2:#0b1224;
      --card: rgba(30,41,59,0.86);
      --card2: rgba(15,23,42,0.72);
      --accent: #3b82f6;
      --accent2: #6366f1;
      --up: #ef4444;
      --down: #22c55e;
      --text: #f1f5f9;
      --sub: #94a3b8;
      --line: rgba(148,163,184,0.14);
      --shadow: 0 10px 26px rgba(0,0,0,0.32);
      --shadow2: 0 6px 18px rgba(0,0,0,0.28);
      --radius: 16px;
    }

    /* ===== 主题：黑金（可选） ===== */
    [data-theme="gold"] {
      --bg: #0a0b10;
      --bg2:#07070b;
      --card: rgba(20,20,24,0.86);
      --card2: rgba(10,10,14,0.72);
      --accent: #f59e0b;
      --accent2: #fbbf24;
      --up: #f97316;
      --down: #22c55e;
      --text: #f8fafc;
      --sub: #a1a1aa;
      --line: rgba(161,161,170,0.14);
      --shadow: 0 10px 26px rgba(0,0,0,0.46);
      --shadow2: 0 6px 18px rgba(0,0,0,0.36);
    }

    * { box-sizing: border-box; margin:0; padding:0; }
    html, body { height:100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(1200px 700px at 20% 0%, rgba(99,102,241,0.18), transparent 55%),
                  radial-gradient(900px 600px at 90% 10%, rgba(59,130,246,0.16), transparent 50%),
                  linear-gradient(135deg, var(--bg), #111a2f 65%, var(--bg2));
      color: var(--text);
      display:flex;
      flex-direction: column;
      align-items:center;
      padding: 14px 12px 28px 12px;
      position:relative;
      overflow-x:hidden;
    }

    /* ====== 顶部 AppBar ====== */
    .appbar {
      position: sticky;
      top: 10px;
      z-index: 50;
      width: 100%;
      max-width: 980px;
      margin: 0 auto 14px auto;
      border-radius: 22px;
      padding: 10px 12px;
      background: rgba(15,23,42,0.68);
      border: 1px solid rgba(148,163,184,0.12);
      box-shadow: var(--shadow2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content: space-between;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 180px;
    }
    .logo {
      width: 36px; height:36px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 18px rgba(59,130,246,0.24);
      display:grid;
      place-items:center;
      font-weight: 900;
      color:white;
      user-select:none;
    }
    .brand .title {
      display:flex;
      flex-direction: column;
      line-height:1.1;
    }
    .brand .title b { font-size: 14px; letter-spacing: 0.3px; }
    .brand .title span { font-size: 12px; color: var(--sub); }

    .appbar-center {
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      max-width: 520px;
    }

    .search {
      flex:1;
      display:flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(51,65,85,0.45);
      border: 1px solid rgba(148,163,184,0.14);
    }
    .search input {
      flex:1;
      background: transparent;
      border:none;
      outline:none;
      color: var(--text);
      font-size: 14px;
    }
    .search .icon {
      color: var(--sub);
      font-size: 14px;
      user-select:none;
    }

    .appbar-actions{
      display:flex;
      align-items:center;
      gap:10px;
      min-width: 260px;
      justify-content: flex-end;
    }

    .chip {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(148,163,184,0.12);
      border: 1px solid rgba(148,163,184,0.14);
      font-size: 12px;
      color: var(--sub);
      user-select:none;
    }
    .chip b { color: var(--text); font-weight: 700; }

    /* ===== Buttons ===== */
    button {
      padding: 9px 12px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      color: white;
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      font-size: 13px;
      background: rgba(51,65,85,0.55);
      border: 1px solid rgba(148,163,184,0.14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 18px rgba(0,0,0,0.32); }
    button:active { transform: translateY(0px) scale(0.99); }

    .btn-primary {
      background: linear-gradient(45deg, #10b981, var(--accent));
      border: none;
    }
    .btn-accent {
      background: linear-gradient(45deg, var(--accent), var(--accent2));
      border: none;
    }
    .btn-danger {
      background: linear-gradient(45deg, #ef4444, #f43f5e);
      border: none;
    }
    .btn-ghost {
      background: rgba(51,65,85,0.35);
    }

    /* ===== Layout containers ===== */
    .wrap {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    h1 { display:none; } /* 用 AppBar 代替 */

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      width: 100%;
      border: 1px solid rgba(148,163,184,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      margin-bottom: 14px;
    }

    /* 登录面板保持但更好看 */
    #loginPanel.card { max-width: 480px; margin-top: 14px; }
    input {
      padding: 11px 12px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.16);
      background: rgba(51,65,85,0.35);
      color: white;
      margin-bottom: 8px;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: rgba(59,130,246,0.45);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.14);
    }

    .form-row { display:flex; gap:10px; flex-wrap:wrap; margin-top: 10px; }
    .form-row input { flex:1; margin-bottom: 0; }
    .form-row button { flex: 1; }

    /* ===== 组合概览 ===== */
    .overview {
      display:flex;
      flex-direction: column;
      gap: 12px;
    }
    .grid {
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .stat-card {
      flex: 1 1 170px;
      min-width: 160px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(15,23,42,0.35);
      border: 1px solid rgba(148,163,184,0.12);
      box-shadow: 0 6px 14px rgba(0,0,0,0.18);
      text-align:center;
    }
    .stat-title { font-size: 12px; color: var(--sub); }
    .stat-value {
      font-size: 20px;
      font-weight: 900;
      margin-top: 6px;
      font-variant-numeric: tabular-nums;
    }
    .up { color: var(--up); }
    .down { color: var(--down); }

    /* ===== 控制条：筛选/排序/编辑模式 ===== */
    .controls {
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
      justify-content: space-between;
    }
    .controls-left, .controls-right {
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap: wrap;
    }
    .seg {
      display:flex;
      gap: 6px;
      padding: 6px;
      border-radius: 16px;
      background: rgba(51,65,85,0.28);
      border: 1px solid rgba(148,163,184,0.12);
    }
    .seg button {
      padding: 8px 10px;
      border-radius: 12px;
      box-shadow: none;
      border: 1px solid transparent;
      background: transparent;
      color: var(--sub);
      font-weight: 800;
    }
    .seg button.active {
      background: rgba(59,130,246,0.18);
      border-color: rgba(59,130,246,0.22);
      color: #dbeafe;
    }
    select {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(148,163,184,0.16);
      background: rgba(51,65,85,0.35);
      color: var(--text);
      outline:none;
      font-weight: 700;
    }

    /* ===== 持仓卡片 ===== */
    .fund-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      border: 1px solid rgba(148,163,184,0.12);
      margin: 0 auto 14px auto;
      overflow: hidden;
      transform: translateZ(0);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .fund-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.36);
      border-color: rgba(99,102,241,0.22);
    }

    .fund-header {
      display:flex;
      justify-content: space-between;
      align-items: flex-start;
      cursor:pointer;
      padding: 14px 14px 12px 14px;
      background: rgba(30,41,59,0.58);
      border-bottom: 1px solid rgba(148,163,184,0.10);
      gap: 12px;
    }

    .fund-header-left { display:flex; flex-direction: column; gap: 6px; flex:1; min-width: 0; }
    .fund-header-right { display:flex; flex-direction: column; align-items:flex-end; gap: 8px; }

    .fund-title-row { display:flex; align-items:center; gap: 8px; flex-wrap: wrap; }
    .fund-title {
      font-weight: 900;
      font-size: 14px;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 480px;
    }
    .code {
      font-size: 12px;
      color: var(--sub);
      font-weight: 800;
    }

    .badge {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid rgba(148,163,184,0.16);
      background: rgba(148,163,184,0.10);
      color: var(--sub);
      user-select:none;
    }
    .badge.live {
      background: rgba(59,130,246,0.16);
      border-color: rgba(59,130,246,0.22);
      color: #dbeafe;
    }
    .badge.real {
      background: rgba(34,197,94,0.14);
      border-color: rgba(34,197,94,0.22);
      color: #dcfce7;
    }
    .badge.closed {
      background: rgba(148,163,184,0.10);
      border-color: rgba(148,163,184,0.16);
      color: #e2e8f0;
    }
    .badge.unknown {
      background: rgba(244,63,94,0.10);
      border-color: rgba(244,63,94,0.18);
      color: #fecdd3;
    }

    .small { font-size: 12px; color: var(--sub); }
    .mono { font-variant-numeric: tabular-nums; }

    .chips {
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip2 {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--sub);
      background: rgba(15,23,42,0.35);
      border: 1px solid rgba(148,163,184,0.12);
      user-select:none;
    }
    .chip2 b { color: var(--text); }

    /* 右侧：盈亏数字 + sparkline */
    .fund-profit {
      font-weight: 1000;
      font-size: 14px;
      text-align:right;
      font-variant-numeric: tabular-nums;
    }
    .blink {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }
      25%, 75% { opacity: .25; }
    }

    .spark-wrap {
      display:flex;
      align-items:center;
      gap: 8px;
    }
    .spark {
      width: 96px;
      height: 34px;
      border-radius: 10px;
      background: rgba(15,23,42,0.30);
      border: 1px solid rgba(148,163,184,0.10);
    }

    .arrow {
      display:inline-block;
      transition: transform .28s ease;
      font-weight: 900;
      color: var(--sub);
      user-select:none;
    }
    .arrow.open { transform: rotate(90deg); }

    /* 预估/实际两行 KPI */
    .today-wrap { display:flex; flex-direction: column; gap: 6px; }
    .today-row {
      display:flex;
      align-items:center;
      gap: 8px;
      line-height: 1.25;
      flex-wrap: wrap;
    }
    .pill {
      display:inline-flex;
      align-items:center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 1000;
      background: rgba(148,163,184,0.12);
      color: var(--sub);
      border: 1px solid rgba(148,163,184,0.16);
      user-select:none;
    }
    .pill.estimate { background: rgba(59,130,246,0.18); border-color: rgba(59,130,246,0.22); color: #dbeafe; }
    .pill.real { background: rgba(34,197,94,0.14); border-color: rgba(34,197,94,0.22); color: #dcfce7; }
    .pill.closed { background: rgba(148,163,184,0.10); border-color: rgba(148,163,184,0.16); color: #e2e8f0; }

    .kpi {
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 14px;
      background: rgba(15,23,42,0.35);
      border: 1px solid rgba(148,163,184,0.12);
    }
    .kpi .label { color: var(--sub); font-size: 12px; font-weight: 800; }
    .kpi .v { font-weight: 1000; font-variant-numeric: tabular-nums; }
    .kpi .v.up { color: var(--up); }
    .kpi .v.down { color: var(--down); }
    .kpi .v.neutral { color: var(--sub); }

    .updated-tag {
      display:inline-flex;
      align-items:center;
      gap: 4px;
      font-size: 11px;
      color: #a7f3d0;
      background: rgba(16,185,129,0.12);
      border: 1px solid rgba(16,185,129,0.18);
      padding: 2px 8px;
      border-radius: 999px;
      user-select:none;
    }

    /* 卡片按钮区域 */
    .fund-buttons {
      display:flex;
      gap: 10px;
      padding: 12px 14px 14px 14px;
      background: rgba(15,23,42,0.36);
      border-bottom: 1px solid rgba(148,163,184,0.10);
    }
    .fund-buttons button { flex: 1; border-radius: 14px; }

    /* 展开内容：动画 */
    .fund-body {
      max-height: 0;
      opacity: 0;
      transform: translateY(-6px);
      overflow: hidden;
      transition: max-height .32s ease, opacity .22s ease, transform .22s ease;
      background: rgba(15,23,42,0.45);
      padding: 0 14px;
    }
    .fund-body.open {
      max-height: 420px;
      opacity: 1;
      transform: translateY(0);
      padding: 12px 14px 14px 14px;
    }

    .period-box {
      display:flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    button.period {
      padding: 7px 10px;
      font-size: 12px;
      background: rgba(51,65,85,0.35);
      border-radius: 12px;
      border: 1px solid rgba(148,163,184,0.14);
      box-shadow: none;
    }
    button.period.active {
      background: rgba(59,130,246,0.22);
      border-color: rgba(59,130,246,0.26);
    }

    canvas.chart {
      margin-top: 6px;
      width: 100% !important;
      height: auto;
      border-radius: 14px;
      background: rgba(15,23,42,0.30);
      border: 1px solid rgba(148,163,184,0.10);
    }

    /* ===== skeleton ===== */
    .skeleton {
      position: relative;
      overflow:hidden;
      background: rgba(148,163,184,0.10);
      border: 1px solid rgba(148,163,184,0.12);
      border-radius: 14px;
    }
    .skeleton::after {
      content:"";
      position:absolute;
      top:0; left:-60%;
      width: 60%;
      height:100%;
      background: linear-gradient(90deg, transparent, rgba(241,245,249,0.10), transparent);
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer { 100% { left: 120%; } }

    .loading {
      text-align:center;
      padding: 12px;
      color: var(--sub);
    }

    /* ===== 全局 Loading 遮罩 ===== */
    #globalLoading {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 16px;
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }
    #globalLoading .spinner {
      border: 4px solid rgba(255,255,255,0.20);
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }
    @keyframes spin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* ===== 编辑模式（拖拽排序） ===== */
    .edit-hint {
      font-size: 12px;
      color: var(--sub);
      display:none;
      align-items:center;
      gap: 8px;
    }
    .edit-hint.show { display:flex; }

    .drag-handle {
      display:none;
      cursor: grab;
      user-select:none;
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(51,65,85,0.35);
      border: 1px solid rgba(148,163,184,0.12);
      color: var(--sub);
      font-weight: 1000;
    }
    .edit-mode .drag-handle { display:inline-flex; }
    .edit-mode .fund-card { animation: wiggle 0.9s infinite; }
    @keyframes wiggle {
      0%,100%{ transform: rotate(0deg) }
      25%{ transform: rotate(0.22deg) }
      75%{ transform: rotate(-0.22deg) }
    }
    .dragging { opacity: 0.7; transform: scale(0.99) !important; }

    /* 拖拽目标高亮 */
    .drop-target { outline: 2px dashed rgba(59,130,246,0.38); outline-offset: -6px; }

    /* ===== 小屏适配 ===== */
    @media (max-width: 720px){
      .appbar { top: 8px; padding: 10px; }
      .brand { min-width: 130px; }
      .appbar-actions { min-width: 0; }
      .spark { width: 88px; }
      .fund-title { max-width: 240px; }
    }
    @media (max-width: 480px){
      body { padding: 12px 10px 24px 10px; }
      .stat-card { flex: 1 1 45%; min-width: 45%; }
      .appbar { border-radius: 18px; }
      .brand .title span { display:none; }
      .chip { display:none; }
      .fund-title { max-width: 190px; }
    }
  </style>
</head>

<body>
  <!-- AppBar -->
  <div class="appbar">
    <div class="brand">
      <div class="logo">DU</div>
      <div class="title">
        <b>爱理财的DU</b>
        <span id="subTitle">Portfolio Dashboard</span>
      </div>
    </div>

    <div class="appbar-center">
      <div class="search">
        <span class="icon">🔎</span>
        <input id="searchInput" placeholder="搜索基金名称 / 代码…" />
        <span class="icon" id="searchClear" style="display:none; cursor:pointer;">✕</span>
      </div>
    </div>

    <div class="appbar-actions">
      <span class="chip">👤 <b id="userNameTop">未登录</b></span>
      <button class="btn-ghost" id="btnRefresh" title="立即刷新">⟳ 刷新</button>
      <button class="btn-ghost" id="btnTheme" title="切换主题">🎨 主题</button>
      <button class="btn-danger" id="btnLogout" style="display:none;">退出</button>
    </div>
  </div>

  <div class="wrap">
    <!-- 登录 -->
    <div id="loginPanel" class="card">
      <h2 style="text-align:center; margin-bottom:10px;">登录 / 注册</h2>
      <input id="username" placeholder="用户名" />
      <input id="password" type="password" placeholder="密码" />
      <div class="form-row">
        <button class="btn-accent" onclick="loginUser()">登录</button>
        <button class="btn-ghost" onclick="registerUser()">注册</button>
      </div>
      <div class="small" style="text-align:center; margin-top:10px;">
        提示：长按基金卡片可进入编辑模式（拖拽排序）
      </div>
    </div>

    <!-- App -->
    <div id="app" style="display:none;">
      <!-- 组合概览 -->
      <div class="card overview">
        <div style="display:flex; justify-content: space-between; align-items:center; gap:10px; flex-wrap: wrap;">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap: wrap;">
            <b style="font-size:14px;">📌 组合概览</b>
            <span class="small" id="lastUpdatedText">—</span>
          </div>
          <div class="edit-hint" id="editHint">✋ 已进入编辑模式：拖拽卡片调整顺序，点“完成”退出</div>
        </div>

        <div class="grid">
          <div class="stat-card">
            <div class="stat-title">总资产</div>
            <div class="stat-value" id="totalAsset">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">总盈亏</div>
            <div class="stat-value" id="totalProfit">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-title">收益率</div>

      <!-- 添加持仓（保留原功能） -->

      <!-- 控制条：筛选/排序/编辑 -->
      <div class="card">

            <select id="sortSelect" title="排序（视图层，不影响自定义顺序）">
              <option value="custom">自定义顺序</option>

              <option value="profit_desc">按总盈亏↓</option>
              <option value="percent_desc">按收益率↓</option>
              <option value="today_est_desc">按今日预估收益↓</option>

          <div class="controls-right">

      <!-- 持仓列表 -->
      <div style="display:flex; justify-content: space-between; align-items:center; margin: 8px 2px 10px 2px;">
        <h3 style="font-size:14px;">持仓列表</h3>
        <span class="small" id="resultCount">—</span>
      </div>

      <div id="list"></div>

      <div class="card">
        <h3 style="margin-bottom:10px;">资产占比</h3>
        <canvas id="pieChart" height="200"></canvas>

  </div>

  <!-- 全局 Loading -->
  <div id="globalLoading">
    <div class="spinner"></div>
    <div>正在加载，请稍候...</div>
  </div>

  <script>
    let chartCache = {};             // 大图 Chart.js
    let pieChart = null;             // 饼图 Chart.js
    let sparkCache = {};             // sparkline 数据缓存 {code: {t, points}}
    let fundMap = new Map();         // code -> fundData
    let visibleCodes = new Set();    // 当前可见卡片 code
    let observer = null;             // IntersectionObserver
    let editMode = false;            // 编辑模式
    let dragSrcCode = null;
    let longPressTimer = null;
    let activeFilter = "all";
    let activeSort = "custom";
    let currentUserName = null;

    // order persistence
    function orderKey(){
      return "fund_order_" + (currentUserName || "guest");
    }
    function themeKey(){
      return "du_theme";
    }

    // ===== Loading 工具 =====
    function showLoading(msg = "加载中...") {
      const l = document.getElementById("globalLoading");
      l.style.display = "flex";
      l.querySelector("div:last-child").innerText = msg;
    }
    function hideLoading() {
      document.getElementById("globalLoading").style.display = "none";
    }
    async function fetchWithLoading(url, options = {}, msg = "加载中...") {
      try {
        showLoading(msg);
        let res = await fetch(url, options);
        hideLoading();
        return res;
      } catch (e) {
        hideLoading();
        alert("请求失败：" + e);
        throw e;
      }
    }
    async function fetchSilent(url, options = {}) {
      // 不弹全局 loading：用于 sparkline/history 等轻量请求
      let res = await fetch(url, options);
      return res;
    }

    // ===== 数字动效 =====
    function animateNumber(el, to, opts = {}) {
      const dur = opts.dur ?? 420;
      const isPercent = opts.isPercent ?? false;
      const prefixSign = opts.prefixSign ?? false;
      const decimals = opts.decimals ?? 2;

      let fromText = (el.dataset.v ?? el.innerText ?? "0").replace(/[^\d\.\-]/g,'');
      let from = parseFloat(fromText);
      if (isNaN(from)) from = 0;

      const start = performance.now();
      function tick(now){
        const p = Math.min(1, (now - start) / dur);
        const eased = 1 - Math.pow(1 - p, 3);
        const v = from + (to - from) * eased;

        el.dataset.v = String(v);

        let txt = v.toFixed(decimals);
        if (prefixSign) txt = (v >= 0 ? "+" : "") + txt;
        if (isPercent) txt = txt + "%";
        el.innerText = txt;

        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // ===== 格式化 =====
    function fmtPercent(v) {
      if (v === null || v === undefined) return "—";
      let n = parseFloat(v);
      if (isNaN(n)) return "—";
      return (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
    }
    function fmtMoney(v) {
      if (v === null || v === undefined) return "—";
      let n = parseFloat(v);
      if (isNaN(n)) return "—";
      return (n >= 0 ? "+" : "") + n.toFixed(2);
    }
    function signClass(v) {
      let n = parseFloat(v);
      if (isNaN(n)) return "neutral";
      if (n > 0) return "up";
      if (n < 0) return "down";
      return "neutral";
    }
    function arrowIcon(v) {
      let n = parseFloat(v);
      if (isNaN(n)) return "•";
      if (n > 0) return "↑";
      if (n < 0) return "↓";
      return "→";
    }
    function isClosed(f) {
      return f.market_status === "closed";
    }
    function isUpdated(f){
      return (f.today_real_percent !== null && f.today_real_percent !== undefined) ||
             (f.today_real_profit !== null && f.today_real_profit !== undefined) ||
             (f.market_status === "real");
    }

    function badgeFor(f){
      if (f.market_status === "open_estimate") return `<span class="badge live">🕘 盘中</span>`;
      if (f.market_status === "real") return `<span class="badge real">✅ 已更新</span>`;
      if (f.market_status === "closed") return `<span class="badge closed">💤 未开盘</span>`;
      return `<span class="badge unknown">⚠️ 异常</span>`;
    }

    function kpiHtml(label, valueText, valueRaw) {
      const cls = signClass(valueRaw);
      const icon = arrowIcon(valueRaw);
      return `
        <span class="kpi">
          <span class="label">${label}</span>
          <span class="v ${cls} mono">${icon} ${valueText}</span>
        </span>`;
    }

    function estimateRowHtml(f) {
      if (isClosed(f)) {
        return `<div class="today-row">
          <span class="pill closed">未开盘</span>
          <span class="small">预估：未开盘</span>
        </div>`;
      }
      return `<div class="today-row">
        <span class="pill estimate">预估</span>
        ${kpiHtml("涨跌", fmtPercent(f.today_estimate_percent), f.today_estimate_percent)}
        ${kpiHtml("收益", fmtMoney(f.today_estimate_profit), f.today_estimate_profit)}
      </div>`;
    }

    function realRowHtml(f) {
      if (isClosed(f)) {
        return `<div class="today-row">
          <span class="pill closed">未开盘</span>
          <span class="small">实际：未开盘</span>
        </div>`;
      }
      const updated = isUpdated(f);
      return `<div class="today-row">
        <span class="pill real">实际</span>
        ${kpiHtml("涨跌", fmtPercent(f.today_real_percent), f.today_real_percent)}
        ${kpiHtml("收益", fmtMoney(f.today_real_profit), f.today_real_profit)}
        ${updated ? `<span class="updated-tag">✅ 已更新</span>` : ``}
      </div>`;
    }

    // ===== 主题切换 =====
    function applyTheme(theme){
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem(themeKey(), theme);
    }
    function toggleTheme(){
      const cur = localStorage.getItem(themeKey()) || "default";
      applyTheme(cur === "default" ? "gold" : "default");
    }

    // ===== 登录态 =====
    window.onload = async () => {
      applyTheme(localStorage.getItem(themeKey()) || "default");

      document.getElementById("btnTheme").onclick = toggleTheme;
      document.getElementById("btnRefresh").onclick = () => refreshRealtime(true);
      document.getElementById("btnLogout").onclick = logoutUser;

      // 搜索
      const s = document.getElementById("searchInput");
      const sc = document.getElementById("searchClear");
      s.addEventListener("input", () => {
        sc.style.display = s.value.trim() ? "inline" : "none";
        renderListFromCache(); // 只重绘列表视图，不请求后端
      });
      sc.addEventListener("click", () => {
        s.value = "";
        sc.style.display = "none";
        renderListFromCache();
      });

      // 筛选
      document.getElementById("filterSeg").addEventListener("click", (e)=>{
        const btn = e.target.closest("button");
        if(!btn) return;
        [...document.querySelectorAll("#filterSeg button")].forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderListFromCache();
      });

      // 排序
      document.getElementById("sortSelect").addEventListener("change", (e)=>{
        activeSort = e.target.value;
        renderListFromCache();
      });

      // 编辑模式
      document.getElementById("btnEdit").onclick = () => setEditMode(true);
      document.getElementById("btnDone").onclick = () => setEditMode(false);

      // 检查登录
      let d = await (await fetchWithLoading("/me", {}, "正在检查登录状态")).json();
      if (d.logged_in) showApp(d.username);
      else {
        document.getElementById("userNameTop").innerText = "未登录";
      }
    };

    function showApp(username) {
      currentUserName = username;
      document.getElementById("loginPanel").style.display = "none";
      document.getElementById("app").style.display = "block";
      document.getElementById("userNameTop").innerText = username;
      document.getElementById("btnLogout").style.display = "inline-flex";
      loadData();
    }

    async function registerUser() {
      let d = await (await fetchWithLoading("/register", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({username: username.value, password: password.value})
      }, "注册中...")).json();
      if (d.error) alert(d.error); else alert("注册成功");
    }

    async function loginUser() {
      let d = await (await fetchWithLoading("/login", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({username: username.value, password: password.value})
      }, "登录中...")).json();
      if (d.error) alert(d.error);
      else showApp(d.username);
    }

    function logoutUser() {
      fetch("/logout").then(() => location.reload());
    }

    // ===== 持仓操作（保留你的功能） =====
    async function addFund() {
      let c = code.value.trim();
      let p = parseFloat(price.value);
      let a = parseFloat(amount.value);

      if (!c) return alert("请输入基金代码");
      if (isNaN(p) || p <= 0) return alert("请输入正确的买入价格");
      if (isNaN(a) || a <= 0) return alert("请输入正确的份额");

      let d = await (await fetchWithLoading("/add", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({code: c, buy_price: p, amount: a})
      }, "添加持仓中...")).json();

      if (d.error) alert(d.error);
      else loadData();
    }

    async function updatePosition(code, delta, price) {
      await fetchWithLoading("/update/" + code, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({delta, buy_price: price})
      }, "更新持仓中...");
      loadData();
    }

    function addShares(code) {
      let n = parseFloat(prompt("加仓份额"));
      if (!n || n <= 0) return;
      let p = parseFloat(prompt("加仓价格"));
      if (!p || p <= 0) return;
      updatePosition(code, n, p);
    }
    function reduceShares(code) {
      let n = parseFloat(prompt("减仓份额"));
      if (n > 0) updatePosition(code, -n);
    }
    function clearShares(code, amount) {
      if (confirm("确认清仓?")) updatePosition(code, -amount);
    }

    // ===== 编辑模式（长按进入 + 按钮进入） =====
    function setEditMode(on){
      editMode = on;
      const app = document.getElementById("app");
      const hint = document.getElementById("editHint");
      const btnEdit = document.getElementById("btnEdit");
      const btnDone = document.getElementById("btnDone");

      if(on){
        app.classList.add("edit-mode");
        hint.classList.add("show");
        btnEdit.style.display = "none";
        btnDone.style.display = "inline-flex";

        // 只有自定义顺序下才允许拖拽
        if(activeSort !== "custom"){
          activeSort = "custom";
          document.getElementById("sortSelect").value = "custom";
          renderListFromCache();
        }
      }else{
        app.classList.remove("edit-mode");
        hint.classList.remove("show");
        btnEdit.style.display = "inline-flex";
        btnDone.style.display = "none";
      }
    }

    function attachLongPress(el){
      const start = () => {
        if(editMode) return;
        longPressTimer = setTimeout(()=> setEditMode(true), 420);
      };
      const cancel = () => {
        if(longPressTimer){
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
      };
      el.addEventListener("touchstart", start, {passive:true});
      el.addEventListener("touchend", cancel);
      el.addEventListener("touchmove", cancel);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", cancel);
      el.addEventListener("mouseleave", cancel);
    }

    // ===== 订单顺序存储 =====
    function getSavedOrder(){
      try{
        const raw = localStorage.getItem(orderKey());
        if(!raw) return null;
        const arr = JSON.parse(raw);
        if(Array.isArray(arr)) return arr;
      }catch(e){}
      return null;
    }
    function saveOrder(arr){
      localStorage.setItem(orderKey(), JSON.stringify(arr));
    }

    // ===== 数据加载 =====
    async function loadData() {
      // 骨架屏（让“滑动快没加载”更不明显）
      renderSkeletonList(6);

      let data = await (await fetchWithLoading("/holdings", {}, "加载持仓中...")).json();
      applyTopStats(data, true);

      // 缓存 funds
      fundMap.clear();
      data.funds.forEach(f => fundMap.set(f.code, f));

      // 初始化顺序（未存则按当前返回）
      const saved = getSavedOrder();
      if(saved && saved.length){
        // 合并：保存里有的优先，新增基金追加
        const nowCodes = data.funds.map(x=>x.code);
        const merged = [];
        saved.forEach(c=>{ if(nowCodes.includes(c)) merged.push(c); });
        nowCodes.forEach(c=>{ if(!merged.includes(c)) merged.push(c); });
        saveOrder(merged);
      }else{
        saveOrder(data.funds.map(x=>x.code));
      }

      // 渲染列表视图
      renderListFromCache(true);

      // 饼图
      updatePie(data.funds);

      // 可见区域更新观察器
      setupObserver();

      // 更新“最后更新时间”
      document.getElementById("lastUpdatedText").innerText = "⏱ " + new Date().toLocaleTimeString();
    }

    // 自动刷新（不重绘全列表，只更新可见卡片）
    async function refreshRealtime(forceAll = false) {
      if(document.getElementById("app").style.display !== "block") return;

      // 按钮动效
      const br = document.getElementById("btnRefresh");
      br.style.filter = "brightness(1.15)";
      br.innerText = "⟳ 刷新中";
      setTimeout(()=>{ br.style.filter=""; br.innerText="⟳ 刷新"; }, 700);

      let data = await (await fetchSilent("/holdings")).json();
      applyTopStats(data, false);

      // 更新 fundMap
      data.funds.forEach(f => fundMap.set(f.code, f));

      // 只更新可见卡片（forceAll=true 就全量更新）
      const codesToUpdate = forceAll ? data.funds.map(x=>x.code) : [...visibleCodes];
      codesToUpdate.forEach(code=>{
        const f = fundMap.get(code);
        if(!f) return;
        const card = document.getElementById("fund_" + code);
        if(!card) return;
        applyFundToCard(card, f);
      });

      // 饼图（可以每次刷新更新）
      updatePie(data.funds);

      document.getElementById("lastUpdatedText").innerText = "⏱ " + new Date().toLocaleTimeString();
    }

    function applyTopStats(data, firstLoad){
      // 这里用数字动效提升高级感
      const ta = document.getElementById("totalAsset");
      const tp = document.getElementById("totalProfit");
      const tpc = document.getElementById("totalPercent");
      const tdy = document.getElementById("todayProfit");

      const total_asset = parseFloat(data.total_asset || 0);
      const total_profit = parseFloat(data.total_profit || 0);
      const total_percent = parseFloat(data.total_percent || 0);
      const today_profit = parseFloat(data.today_profit || 0);

      animateNumber(ta, total_asset, {decimals:2, prefixSign:false, dur:firstLoad?220:520});
      animateNumber(tp, total_profit, {decimals:2, prefixSign:true, dur:firstLoad?220:520});
      animateNumber(tpc, total_percent, {decimals:2, prefixSign:true, isPercent:true, dur:firstLoad?220:520});
      animateNumber(tdy, today_profit, {decimals:2, prefixSign:true, dur:firstLoad?220:520});

      // 颜色
      tp.className = "stat-value " + (total_profit >= 0 ? "up" : "down");
      tpc.className = "stat-value " + (total_percent >= 0 ? "up" : "down");
      tdy.className = "stat-value " + (today_profit >= 0 ? "up" : "down");

      // 如果后端提供 today_estimate_profit/today_real_profit，就展示两行（更高级）
      const est = data.today_estimate_profit;
      const real = data.today_real_profit;

      const extra = document.getElementById("todayExtra");
      if(est !== undefined || real !== undefined){
        extra.style.display = "block";
        document.getElementById("todayEstTotal").innerText = fmtMoney(est);
        document.getElementById("todayRealTotal").innerText = fmtMoney(real);
        document.getElementById("todayRealUpdated").style.display = (real !== null && real !== undefined) ? "inline-flex" : "none";
      }else{
        extra.style.display = "none";
      }
    }

    // ===== 列表渲染（分片渲染 + 过滤/排序 + 自定义顺序） =====
    function getViewCodes(){
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const codes = getSavedOrder() || [...fundMap.keys()];

      // 过滤
      let arr = codes.filter(code=>{
        const f = fundMap.get(code);
        if(!f) return false;
        const key = (String(f.name||"") + " " + String(f.code||"")).toLowerCase();
        if(search && !key.includes(search)) return false;

        if(activeFilter === "up") return (parseFloat(f.profit||0) >= 0);
        if(activeFilter === "down") return (parseFloat(f.profit||0) < 0);
        if(activeFilter === "closed") return (f.market_status === "closed");
        if(activeFilter === "updated") return isUpdated(f);
        return true;
      });

      // 排序（视图层，不影响保存顺序；custom 直接用 arr）
      const sort = activeSort;
      if(sort !== "custom"){
        const val = (f)=>{
          if(sort === "holding_desc") return parseFloat(f.holding||0);
          if(sort === "profit_desc") return parseFloat(f.profit||0);
          if(sort === "percent_desc") return parseFloat(f.percent||0);
          if(sort === "today_est_desc") return parseFloat(f.today_estimate_profit ?? -Infinity);
          if(sort === "today_real_desc") return parseFloat(f.today_real_profit ?? -Infinity);
          return 0;
        };
        arr.sort((a,b)=>{
          const fa = fundMap.get(a), fb = fundMap.get(b);
          return val(fb) - val(fa);
        });
      }

      return arr;
    }

    function renderSkeletonList(n){
      const list = document.getElementById("list");
      list.innerHTML = "";
      for(let i=0;i<n;i++){
        const sk = document.createElement("div");
        sk.className = "fund-card";
        sk.innerHTML = `
          <div style="padding:14px;">
            <div class="skeleton" style="height:16px; width:62%; margin-bottom:10px;"></div>
            <div class="skeleton" style="height:12px; width:48%; margin-bottom:8px;"></div>
            <div class="skeleton" style="height:12px; width:72%; margin-bottom:10px;"></div>
            <div style="display:flex; gap:10px;">
              <div class="skeleton" style="height:34px; flex:1;"></div>
              <div class="skeleton" style="height:34px; flex:1;"></div>
            </div>
          </div>
        `;
        list.appendChild(sk);
      }
    }

    function renderListFromCache(first = false){
      const list = document.getElementById("list");
      const codes = getViewCodes();

      // 结果数量
      document.getElementById("resultCount").innerText = `共 ${codes.length} 条`;

      // 分片渲染：避免“滑动快没来得及加载”
      list.innerHTML = "";
      const chunkSize = 8;
      let idx = 0;

      function renderChunk(){
        const end = Math.min(idx + chunkSize, codes.length);
        for(; idx<end; idx++){
          const code = codes[idx];
          const f = fundMap.get(code);
          if(!f) continue;
          const div = buildFundCard(f);
          list.appendChild(div);
        }
        if(idx < codes.length){
          requestAnimationFrame(renderChunk);
        }else{
          // 重新绑定观察器
          setupObserver();

          // 让可见卡片立即更新 sparkline（更丝滑）
          setTimeout(()=> refreshVisibleSparks(), 50);
        }
      }

      // 空态
      if(codes.length === 0){
        list.innerHTML = `<div class="loading">没有匹配的持仓</div>`;
        return;
      }

      requestAnimationFrame(renderChunk);
    }

    function buildFundCard(f){
      const div = document.createElement("div");
      div.className = "fund-card";
      div.id = "fund_" + f.code;
      div.dataset.code = f.code;
      div.draggable = true; // 仅在 editMode+custom 时生效

      div.innerHTML = `
        <div class="fund-header">
          <div class="fund-header-left">
            <div class="fund-title-row">
              <span class="drag-handle" title="拖拽排序">≡</span>
              <span class="fund-title">${escapeHtml(f.name || "")}</span>
              <span class="code">(${escapeHtml(f.code)})</span>
              ${badgeFor(f)}
            </div>

            <div class="chips">
              <span class="chip2">💰 持有 <b class="mono holding">${f.holding}</b></span>
              <span class="chip2">📈 当前 <b class="mono realtime">${f.current}</b></span>
              <span class="chip2">🗓 净值日 <b class="mono nav-date">${escapeHtml(f.nav_date || "—")}</b></span>
            </div>

            <div class="today-wrap">
              <div class="today-estimate-wrap">${estimateRowHtml(f)}</div>
              <div class="today-real-wrap">${realRowHtml(f)}</div>
            </div>
          </div>

          <div class="fund-header-right">
            <div class="spark-wrap">
              <canvas class="spark spark_${f.code}" width="96" height="34"></canvas>
              <span class="arrow">▶</span>
            </div>
            <div class="fund-profit ${parseFloat(f.percent||0) >= 0 ? "up blink" : "down blink"}">
              <span class="mono fp">${f.profit}</span>
              <span class="small mono">(${parseFloat(f.percent||0) >= 0 ? "+" : ""}${f.percent}%)</span>
            </div>
          </div>
        </div>

        <div class="fund-buttons">
          <button class="btn-accent" onclick="addShares('${f.code}')">➕ 加仓</button>
          <button class="btn-ghost" onclick="reduceShares('${f.code}')">➖ 减仓</button>
          <button class="btn-danger" onclick="clearShares('${f.code}',${f.amount})">🧹 清仓</button>
        </div>

        <div class="fund-body">
          <div class="period-box" id="period_${f.code}">
            <button class="period" onclick="changePeriod('${f.code}','1m',this)">1月</button>
            <button class="period active" onclick="changePeriod('${f.code}','3m',this)">3月</button>
            <button class="period" onclick="changePeriod('${f.code}','6m',this)">6月</button>
            <button class="period" onclick="changePeriod('${f.code}','1y',this)">1年</button>
          </div>

          <div class="skeleton chart-skel" style="height: 140px; border-radius:14px; display:none;"></div>
          <canvas id="chart_${f.code}" class="chart" height="140"></canvas>
        </div>
      `;

      // 长按进入编辑模式
      attachLongPress(div.querySelector(".fund-header"));

      // 点击展开收起（保持你原有行为，但更丝滑）
      const header = div.querySelector(".fund-header");
      const body = div.querySelector(".fund-body");
      const arrow = div.querySelector(".arrow");

      header.addEventListener("click", (e) => {
        // 编辑模式下，点击不展开（避免误触）
        if(editMode) return;

        const isOpen = body.classList.contains("open");
        if(!isOpen){
          body.classList.add("open");
          arrow.classList.add("open");
          loadHistory(f.code, getActivePeriod(f.code));
        }else{
          body.classList.remove("open");
          arrow.classList.remove("open");
        }
      });

      // 拖拽事件
      div.addEventListener("dragstart", (e)=>{
        if(!editMode || activeSort !== "custom"){
          e.preventDefault();
          return;
        }
        dragSrcCode = div.dataset.code;
        div.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", dragSrcCode);
      });

      div.addEventListener("dragend", ()=>{
        div.classList.remove("dragging");
        dragSrcCode = null;
        clearDropTargets();
      });

      div.addEventListener("dragover", (e)=>{
        if(!editMode || activeSort !== "custom") return;
        e.preventDefault();
        div.classList.add("drop-target");
      });

      div.addEventListener("dragleave", ()=>{
        div.classList.remove("drop-target");
      });

      div.addEventListener("drop", (e)=>{
        if(!editMode || activeSort !== "custom") return;
        e.preventDefault();
        const src = e.dataTransfer.getData("text/plain");
        const dst = div.dataset.code;
        if(!src || !dst || src === dst) return;
        reorderByDrag(src, dst);
      });

      // 初始绘制 sparkline（懒加载：等可见再画）
      return div;
    }

    function clearDropTargets(){
      document.querySelectorAll(".drop-target").forEach(el=>el.classList.remove("drop-target"));
    }

    function reorderByDrag(src, dst){
      const order = getSavedOrder() || [];
      const s = order.indexOf(src);
      const d = order.indexOf(dst);
      if(s < 0 || d < 0) return;

      order.splice(s, 1);
      order.splice(d, 0, src);
      saveOrder(order);

      // 重新渲染视图
      renderListFromCache();
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    // ===== 周期选择（保留） =====
    function getActivePeriod(code) {
      let box = document.getElementById("period_" + code);
      if(!box) return "3m";
      for (let btn of box.children) if (btn.classList.contains("active")) return btn.innerText.replace(/[^\d]/g, '') + 'm';
      return "3m";
    }

    function changePeriod(code, period, btn) {
      let box = document.getElementById("period_" + code);
      [...box.children].forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      let chartDiv = document.getElementById("fund_" + code).querySelector(".fund-body");
      if (chartDiv.classList.contains("open")) loadHistory(code, period);
    }

    // ===== 大图历史（保留） =====
    async function loadHistory(code, period) {
      const card = document.getElementById("fund_" + code);
      if(!card) return;

      const sk = card.querySelector(".chart-skel");
      const canvas = document.getElementById("chart_" + code);
      const ctx = canvas.getContext("2d");

      // skeleton
      sk.style.display = "block";
      canvas.style.display = "none";

      let data = await (await fetchWithLoading(`/history/${code}/${period}`, {}, "加载历史数据中...")).json();
      if (!data.length) {
        sk.style.display = "none";
        canvas.style.display = "block";
        return;
      }

      if (chartCache[code]) chartCache[code].destroy();

      let first = data[0].value, last = data[data.length - 1].value, isUp = last >= first;
      let gradient = ctx.createLinearGradient(0, 0, 0, 200);
      gradient.addColorStop(0, isUp ? "rgba(239,68,68,0.35)" : "rgba(34,197,94,0.30)");
      gradient.addColorStop(1, "rgba(0,0,0,0)");

      chartCache[code] = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => d.date),
          datasets: [{
            data: data.map(d => d.value),
            borderColor: isUp ? "#ef4444" : "#22c55e",
            backgroundColor: gradient,
            fill: true,
            tension: 0.3,
            pointRadius: 0
          }]
        },
        options: {
          plugins: {legend: {display: false}},
          scales: {x: {display: false}, y: {display: true, ticks: {color: "rgba(148,163,184,0.8)"}}},
          animation: {duration: 400}
        }
      });

      sk.style.display = "none";
      canvas.style.display = "block";
    }

    // ===== 饼图（保留） =====
    function updatePie(funds) {
      if (!funds || !funds.length) return;
      if (pieChart) pieChart.destroy();
      pieChart = new Chart(document.getElementById("pieChart"), {
        type: 'doughnut',
        data: {labels: funds.map(f => f.name), datasets: [{data: funds.map(f => f.current * f.amount)}]},
        options: {plugins:{legend:{labels:{color:"rgba(241,245,249,0.9)"}}}}
      });
    }

    // ===== 可见区域更新（解决滑动快/卡顿/没加载） =====
    function setupObserver(){
      if(observer){
        observer.disconnect();
        observer = null;
      }
      visibleCodes.clear();

      observer = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          const card = entry.target;
          const code = card.dataset.code;
          if(!code) return;

          if(entry.isIntersecting){
            visibleCodes.add(code);

            // 进入视口：用最新 fundMap 数据补齐 UI（避免“滑动快看见旧内容”）
            const f = fundMap.get(code);
            if(f) applyFundToCard(card, f);

            // sparkline 懒加载绘制
            drawSparkIfNeeded(code);
          }else{
            visibleCodes.delete(code);
          }
        });
      }, {root:null, rootMargin:"200px 0px", threshold: 0.05});

      document.querySelectorAll(".fund-card[data-code]").forEach(card=>{
        observer.observe(card);
      });
    }

    function refreshVisibleSparks(){
      [...visibleCodes].forEach(code=> drawSparkIfNeeded(code));
    }

    function applyFundToCard(card, f){
      // 盈亏
      const profitEl = card.querySelector(".fp");
      if(profitEl) profitEl.innerText = f.profit;

      const fpWrap = card.querySelector(".fund-profit");
      if(fpWrap){
        fpWrap.className = "fund-profit " + (parseFloat(f.percent||0) >= 0 ? "up blink" : "down blink");
        fpWrap.querySelector(".small").innerText = `(${parseFloat(f.percent||0) >= 0 ? "+" : ""}${f.percent}%)`;
      }

      // chips
      const holdingEl = card.querySelector(".holding");
      if(holdingEl) holdingEl.innerText = f.holding;

      const currentEl = card.querySelector(".realtime");
      if(currentEl) currentEl.innerText = f.current;

      const navDateEl = card.querySelector(".nav-date");
      if(navDateEl) navDateEl.innerText = f.nav_date || "—";

      // badge
      const titleRow = card.querySelector(".fund-title-row");
      if(titleRow){
        // 只替换 badge（最后一个 badge）
        const oldBadge = titleRow.querySelector(".badge");
        if(oldBadge) oldBadge.outerHTML = badgeFor(f);
      }

      // 预估/实际两行
      const est = card.querySelector(".today-estimate-wrap");
      const real = card.querySelector(".today-real-wrap");
      if(est) est.innerHTML = estimateRowHtml(f);
      if(real) real.innerHTML = realRowHtml(f);
    }

    // ===== Mini Sparkline（轻量 canvas，不用 Chart.js） =====
    async function drawSparkIfNeeded(code){
      const card = document.getElementById("fund_" + code);
      if(!card) return;
      const canvas = card.querySelector(".spark_" + code);
      if(!canvas) return;

      // 已有且未过期就直接绘制
      const now = Date.now();
      const cached = sparkCache[code];
      if(cached && (now - cached.t < 5 * 60 * 1000) && cached.points && cached.points.length){
        drawSpark(canvas, cached.points);
        return;
      }

      // 拉历史（静默）
      try{
        const period = "1m";
        const res = await fetchSilent(`/history/${code}/${period}`);
        const data = await res.json();
        if(!Array.isArray(data) || data.length < 3) return;

        // 取最后 18 个点
        const points = data.slice(-18).map(x => parseFloat(x.value)).filter(v=>!isNaN(v));
        if(points.length < 3) return;

        sparkCache[code] = {t: now, points};
        drawSpark(canvas, points);
      }catch(e){
        // ignore
      }
    }

    function drawSpark(canvas, points){
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;

      ctx.clearRect(0,0,w,h);

      const min = Math.min(...points);
      const max = Math.max(...points);
      const range = (max - min) || 1;

      // 背景轻微网格
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(148,163,184,0.10)";
      ctx.beginPath();
      ctx.moveTo(0, h-1); ctx.lineTo(w, h-1);
      ctx.stroke();

      // 颜色：涨红跌绿（按首尾）
      const up = points[points.length-1] >= points[0];
      const stroke = up ? "#ef4444" : "#22c55e";
      const fill = up ? "rgba(239,68,68,0.18)" : "rgba(34,197,94,0.16)";

      // path
      ctx.beginPath();
      points.forEach((v, i)=>{
        const x = (i/(points.length-1))* (w-2) + 1;
        const y = h - 2 - ((v - min)/range) * (h-6);
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
      });

      // 填充
      ctx.lineTo(w-1, h-1);
      ctx.lineTo(1, h-1);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();

      // 线条
      ctx.beginPath();
      points.forEach((v, i)=>{
        const x = (i/(points.length-1))* (w-2) + 1;
        const y = h - 2 - ((v - min)/range) * (h-6);
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
      });
      ctx.strokeStyle = stroke;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // ===== 自动刷新（保留你的 30s，但更聪明：只更新可见卡片） =====
    setInterval(() => {
      if (document.getElementById("app").style.display === "block") refreshRealtime(false);
    }, 30000);
  </script>
